name: callvault_prototype
description: CallVault critical recording prototype — detect SIM call, record, save, play.
publish_to: "none"
version: 1.4.4+44

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  path: ^1.9.1
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/pyx_logo.png
